appId: com.truecount.app
name: Native onboarding and navigation
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "How well do you know the tables.*"
    timeout: 30000
- takeScreenshot: native-onboarding-first-launch
- scrollUntilVisible:
    centerElement: true
    element:
      text: "I've played a few times"
    direction: DOWN
- tapOn: "I've played a few times"
- scrollUntilVisible:
    centerElement: true
    element:
      text: Continue
    direction: DOWN
- tapOn: Continue
- assertVisible: "What brings you to the table.*"
- scrollUntilVisible:
    centerElement: true
    element:
      text: Master strategy
    direction: DOWN
- tapOn: Master strategy
- scrollUntilVisible:
    centerElement: true
    element:
      text: Continue
    direction: DOWN
- tapOn: Continue
- assertVisible: "Planning a casino trip.*"
- scrollUntilVisible:
    centerElement: true
    element:
      text: Your first name
    direction: DOWN
- tapOn: Your first name
- inputText: Native Tester
- assertVisible: Native Tester
- takeScreenshot: native-onboarding-name
- hideKeyboard
- scrollUntilVisible:
    centerElement: true
    element:
      text: Finish
    direction: DOWN
- takeScreenshot: native-onboarding-profile
- tapOn: Finish
- extendedWaitUntil:
    visible: "Good (morning|afternoon|evening), Native Tester.*"
    timeout: 15000
- takeScreenshot: native-onboarding-lobby
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Good (morning|afternoon|evening), Native Tester.*"
    timeout: 30000
- assertNotVisible: "How well do you know the tables.*"
- takeScreenshot: native-onboarding-persisted
